<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayGift Rivals — 1v1 Connect Four</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    input { padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 14px; }
    .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; background: #1d4ed8; padding: 12px; border-radius: 12px; margin-top: 10px; }
    .cell { aspect-ratio: 1 / 1; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    .p1 { background: #ef4444; }
    .p2 { background: #facc15; }
    .meta { color: #94a3b8; font-size: 14px; }
    a { color: #60a5fa; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="meta"><a href="../">← Back to Hub</a></p>
      <h1>RayGift Rivals — 1v1 Connect Four</h1>
      <p class="meta">Create or join a match with an invite code. Moves validate server-side and save to shared GitHub JSON.</p>
      <div class="row">
        <label for="playerName">Name:</label>
        <input id="playerName" type="text" maxlength="20" value="RAYJOR" />
        <label for="playerSlot">Slot:</label>
        <select id="playerSlot">
          <option value="1">Player 1 (Red)</option>
          <option value="2">Player 2 (Yellow)</option>
        </select>
      </div>
      <div class="row">
        <button id="createBtn" type="button">Create Invite Match</button>
        <input id="inviteInput" type="text" maxlength="8" placeholder="INVITE CODE" style="text-transform:uppercase; width:140px;" />
        <button id="joinBtn" type="button">Join Match</button>
        <button id="refreshBtn" type="button">Refresh State</button>
      </div>
      <p id="statusText" class="meta">Ready to create or join a 1v1 match.</p>
      <p id="shareInfo" class="meta"></p>
    </div>

    <div class="card">
      <h2 id="matchHeading">Board</h2>
      <div class="cols" id="dropButtons"></div>
      <div class="board" id="boardGrid"></div>
    </div>
  </div>
  <script>
    const RIVALS_WORKER_URL = "https://raygift-rivals-worker.3659745.workers.dev";
    let currentCode = "";
    let currentGame = null;
    let inflightMove = false;

    const nameEl = document.getElementById("playerName");
    const slotEl = document.getElementById("playerSlot");
    const codeInput = document.getElementById("inviteInput");
    const statusEl = document.getElementById("statusText");
    const shareEl = document.getElementById("shareInfo");
    const headingEl = document.getElementById("matchHeading");
    const dropEl = document.getElementById("dropButtons");
    const boardEl = document.getElementById("boardGrid");

    function esc(s) {
      return String(s || "").replace(/[<>&"]/g, "");
    }

    function renderGame(game) {
      currentGame = game;
      if (!game) {
        headingEl.textContent = "Board";
        dropEl.innerHTML = "";
        boardEl.innerHTML = "";
        return;
      }
      currentCode = game.code;
      codeInput.value = game.code;
      const p1 = esc(game.players?.[1]?.name || "Waiting P1");
      const p2 = esc(game.players?.[2]?.name || "Waiting P2");
      let stateLabel = "";
      if (game.winner) {
        const winName = game.winner === 1 ? p1 : p2;
        stateLabel = `Winner: ${winName} (Player ${game.winner})`;
      } else if (game.isDraw) {
        stateLabel = "Match ended in a draw!";
      } else if (!game.players?.[2]) {
        stateLabel = "Waiting for Player 2 to join with invite code";
      } else {
        const turnName = game.turn === 1 ? p1 : p2;
        stateLabel = `Turn: ${turnName} (Player ${game.turn})`;
      }
      headingEl.textContent = `Match ${esc(game.code)} — ${stateLabel}`;
      shareEl.innerHTML = `Invite Code: <code>${esc(game.code)}</code> | P1 (Red): <strong>${p1}</strong> vs P2 (Yellow): <strong>${p2}</strong>`;

      const mySlot = Number(slotEl.value);
      const canMove = !game.winner && !game.isDraw && game.players?.[1] && game.players?.[2] && game.turn === mySlot && !inflightMove;
      dropEl.innerHTML = "";
      for (let c = 0; c < 7; c++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `Col ${c + 1}`;
        btn.disabled = !canMove || game.board[0][c] !== 0;
        btn.addEventListener("click", () => submitMove(c));
        dropEl.appendChild(btn);
      }

      boardEl.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 7; c++) {
          const cell = document.createElement("div");
          const v = game.board[r][c];
          cell.className = "cell" + (v === 1 ? " p1" : v === 2 ? " p2" : "");
          boardEl.appendChild(cell);
        }
      }
    }

    async function fetchGame(code) {
      const clean = String(code || "").trim().toUpperCase();
      if (!clean) return;
      const res = await fetch(`${RIVALS_WORKER_URL}/game?code=${encodeURIComponent(clean)}`, { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      renderGame(data.game);
    }

    document.getElementById("createBtn").addEventListener("click", async () => {
      try {
        statusEl.textContent = "Creating invite match...";
        const res = await fetch(`${RIVALS_WORKER_URL}/create`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playerName: nameEl.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        slotEl.value = "1";
        renderGame(data.game);
        statusEl.textContent = `Created match ${data.code}. Share this code with Player 2.`;
      } catch (e) {
        statusEl.textContent = `Create error: ${e.message}`;
      }
    });

    document.getElementById("joinBtn").addEventListener("click", async () => {
      try {
        const clean = codeInput.value.trim().toUpperCase();
        statusEl.textContent = `Joining match ${clean}...`;
        const res = await fetch(`${RIVALS_WORKER_URL}/join`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: clean, playerName: nameEl.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        slotEl.value = "2";
        renderGame(data.game);
        statusEl.textContent = `Joined match ${data.code} as Player 2.`;
      } catch (e) {
        statusEl.textContent = `Join error: ${e.message}`;
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", async () => {
      try {
        await fetchGame(codeInput.value || currentCode);
        statusEl.textContent = "Board refreshed.";
      } catch (e) {
        statusEl.textContent = `Refresh error: ${e.message}`;
      }
    });

    async function submitMove(col) {
      if (!currentCode || inflightMove) return;
      inflightMove = true;
      renderGame(currentGame);
      try {
        const moveId = `${currentCode}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const res = await fetch(`${RIVALS_WORKER_URL}/move`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code: currentCode,
            player: Number(slotEl.value),
            col,
            moveId
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        renderGame(data.game);
        statusEl.textContent = `Move placed in column ${col + 1}.`;
      } catch (e) {
        statusEl.textContent = `Move rejected: ${e.message}`;
        await fetchGame(currentCode).catch(() => {});
      } finally {
        inflightMove = false;
        renderGame(currentGame);
      }
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get("code")) {
      codeInput.value = params.get("code").toUpperCase();
      fetchGame(codeInput.value).catch(() => {});
    }
  </script>
</body>
</html>
