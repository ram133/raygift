<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayGift Table — Quick Tap</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tap-btn { width: 100%; height: 140px; font-size: 24px; font-weight: 700; background: #16a34a; margin-top: 12px; }
    input { padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
    ol { padding-left: 20px; }
    li { padding: 6px 0; border-bottom: 1px solid #334155; }
    .meta { color: #94a3b8; font-size: 14px; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="meta"><a href="../">← Back to Hub</a></p>
      <h1>RayGift Table — Quick Tap</h1>
      <p class="meta">10-second rapid tap sprint. Top 10 scores sync to the shared GitHub leaderboard.</p>
      <div>
        <label for="playerName">Player Name:</label>
        <input id="playerName" type="text" maxlength="20" placeholder="RAYJOR" value="RAYJOR" />
        <button id="startBtn" type="button">Start 10s Round</button>
      </div>
      <p>Time left: <strong id="timeLeft">10.0</strong>s | Score: <strong id="scoreVal">0</strong></p>
      <button id="tapBtn" class="tap-btn" type="button" disabled>TAP!</button>
      <p id="statusMsg" class="meta"></p>
    </div>
    <div class="card">
      <h2>Top 10 Leaderboard</h2>
      <ol id="boardList"><li class="meta">Loading leaderboard...</li></ol>
    </div>
  </div>
  <script>
    // Replace WORKER_URL after deploying the free Cloudflare Worker
    const WORKER_URL = window.RAYGIFT_TABLE_WORKER_URL || "https://raygift-table-leaderboard.3659745.workers.dev";
    const GITHUB_RAW_JSON = "https://raw.githubusercontent.com/ram133/raygift/main/data/leaderboard.json";

    let score = 0;
    let timeRemaining = 10.0;
    let timerId = null;
    let active = false;

    const startBtn = document.getElementById("startBtn");
    const tapBtn = document.getElementById("tapBtn");
    const timeEl = document.getElementById("timeLeft");
    const scoreEl = document.getElementById("scoreVal");
    const statusEl = document.getElementById("statusMsg");
    const boardEl = document.getElementById("boardList");
    const nameInput = document.getElementById("playerName");

    function renderBoard(scores) {
      const top10 = (Array.isArray(scores) ? scores : [])
        .slice()
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
        .slice(0, 10);
      if (!top10.length) {
        boardEl.innerHTML = '<li class="meta">No scores recorded yet. Be the first!</li>';
        return;
      }
      boardEl.innerHTML = top10.map((entry, idx) =>
        `<li><strong>#${idx + 1}</strong> ${String(entry.name || "Player").replace(/[<>&]/g, "")} — <strong>${Number(entry.score || 0)}</strong> taps</li>`
      ).join("");
    }

    async function loadBoard() {
      try {
        const res = await fetch(`${WORKER_URL}/leaderboard`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          renderBoard(data.scores || []);
          return;
        }
      } catch (_) {}
      try {
        const res = await fetch(GITHUB_RAW_JSON, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          renderBoard(data.scores || []);
          return;
        }
      } catch (_) {}
      renderBoard([]);
    }

    async function submitScore(finalScore) {
      const name = (nameInput.value || "Player").trim().slice(0, 20) || "Player";
      statusEl.textContent = "Submitting score to leaderboard...";
      try {
        const res = await fetch(`${WORKER_URL}/score`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, score: finalScore })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderBoard(data.scores || []);
        statusEl.textContent = `Saved ${finalScore} taps for ${name}!`;
      } catch (err) {
        statusEl.textContent = `Could not post score (${err.message}). Check Worker URL & GITHUB_TOKEN secret.`;
      }
    }

    startBtn.addEventListener("click", () => {
      score = 0;
      timeRemaining = 10.0;
      active = true;
      scoreEl.textContent = "0";
      timeEl.textContent = "10.0";
      statusEl.textContent = "Go! Tap as fast as you can!";
      startBtn.disabled = true;
      tapBtn.disabled = false;
      const startedAt = performance.now();
      timerId = setInterval(() => {
        const elapsed = (performance.now() - startedAt) / 1000;
        timeRemaining = Math.max(0, 10 - elapsed);
        timeEl.textContent = timeRemaining.toFixed(1);
        if (timeRemaining <= 0) {
          clearInterval(timerId);
          active = false;
          tapBtn.disabled = true;
          startBtn.disabled = false;
          submitScore(score);
        }
      }, 100);
    });

    tapBtn.addEventListener("click", () => {
      if (!active) return;
      score += 1;
      scoreEl.textContent = String(score);
    });

    loadBoard();
  </script>
</body>
</html>
